<style>

main{max-width:1440px;margin:0 auto;padding:0 24px 56px}header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #bbb;padding:4px 0}.header-row{display:flex;align-items:center;gap:10px 18px;min-height:34px}h1{font-size:23px;line-height:1.3;margin:0;flex:none}h1 a{color:inherit;text-decoration:none}h2{font-size:20px;line-height:1.55;margin:0 0 8px}.feed article h2{color:#14532d}a{color:#174c86;text-underline-offset:3px}a:focus-visible,button:focus-visible{outline:2px solid #14532d;outline-offset:3px}.update-controls{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}.updated,.meta{font-size:14px;color:#555}.new-filter{border:0;background:transparent;color:#555;font:inherit;font-size:14px;padding:2px 0;cursor:pointer}.race-tabs{display:flex;align-items:center;gap:14px;white-space:nowrap}.desktop-race-tabs{height:28px;min-height:28px;padding:4px 0 3px;border-bottom:1px solid #ddd;overflow-x:auto}.race-tab{border:0;background:transparent;color:#777;padding:0;font:inherit;font-size:14px;cursor:pointer}.race-tab[aria-pressed="true"]{color:#174c86;font-weight:700}.mobile-race-tabs{display:none}
.layout{display:grid;grid-template-columns:minmax(230px,320px) minmax(0,1fr);gap:36px;align-items:start}nav{position:sticky;top:calc(var(--header-height, 42px) + 8px);height:calc(100dvh - var(--header-height, 42px) - 16px);max-height:calc(100dvh - var(--header-height, 42px) - 16px);overflow:hidden;padding-top:0}.mobile-title-scroll{max-height:calc(100dvh - var(--header-height, 42px) - 34px);overflow-y:auto}.title-group h3{font-size:14px;margin:10px 0 4px}.title-group ol{margin:0;padding:0;list-style:none}.title-group li{padding:2px 0}.title-group li[data-new="true"] a{color:#174c86}.title-group a{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc-list-title{display:inline}.sp-list-title{display:none}.feed article.category-first,.feed article.visible-first{border-top:0;padding-top:12px}article{border-top:1px solid #bbb;padding:28px 0;scroll-margin-top:calc(var(--header-height, 42px) + 12px)}article p{font-size:17px;margin:0 0 18px}.meta{margin:4px 0 14px}.meta a{color:inherit}.subheading{font-size:17px;font-weight:700}.notice{padding:10px 14px;border-left:3px solid #999;background:#f5f5f5}figure{margin:0 0 18px}figure img{display:block;width:auto;max-width:300px;height:auto;max-height:300px;object-fit:contain}figcaption{font-size:14px;color:#555;line-height:1.55;margin-top:5px}[hidden]{display:none!important}.menu-toggle,.pull-refresh{display:none}
@media(max-width:700px){body{font-size:17px;line-height:1.8}main{padding:0 16px 36px}header{padding:1px 0;min-height:42px}.header-row{gap:6px 10px}h1{font-size:20px}.desktop-race-tabs{display:none}.updated{font-size:14px}.new-filter{font-size:14px;padding:0}.layout{display:block}.menu-toggle{display:inline-flex;align-items:center;justify-content:center;flex:none;order:3;margin-left:auto;width:32px;height:34px;border:0;background:transparent;color:inherit;padding:4px}.hamburger{display:flex;flex-direction:column;gap:4px}.hamburger span{display:block;width:20px;height:2px;background:currentColor}.layout nav{display:none;position:fixed;top:var(--header-height, 42px);left:0;right:0;bottom:0;z-index:19;height:calc(100dvh - var(--header-height, 42px));overflow:hidden;padding:0 16px;background:#fff;border-bottom:1px solid #bbb;box-shadow:0 5px 10px #0002;flex-direction:column}body.menu-open{overflow:hidden;touch-action:none}body.menu-open .layout nav{display:flex}body.menu-open .feed{pointer-events:none;user-select:none}.mobile-race-tabs{display:flex;flex:none;gap:14px;padding:10px 0;margin:0;border-bottom:1px solid #ddd;overflow-x:auto;background:#fff;position:relative;z-index:2}.mobile-race-tabs .race-tab{font-size:14px}.mobile-title-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:8px 0 14px}.title-group a{max-width:100%;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc-list-title{display:none}.sp-list-title{display:inline}h2{font-size:20px}figcaption{font-size:14px}.pull-refresh{display:block;position:fixed;top:0;left:50%;z-index:25;padding:3px 14px;background:#14532d;color:#fff;border-radius:0 0 12px 12px;font-size:14px;pointer-events:none;transform:translate(-50%,-110%);transition:transform .15s}.pull-refresh.active{transform:translate(-50%,0)}}
@media print{header{position:static}.menu-toggle,nav,.pull-refresh{display:none!important}main{max-width:none;padding:0}.layout{display:block}}
</style></head><body><div class="pull-refresh" role="status" aria-live="polite">下に引いて更新</div><main id="top">
<header><div class="header-row"><button class="menu-toggle" type="button" aria-label="タイトル一覧を開く" aria-controls="news-nav" aria-expanded="false"><span class="hamburger" aria-hidden="true"><span></span><span></span><span></span></span></button><h1><a href="#top">公営競技ニュース</a></h1><div class="update-controls"><time class="updated" datetime="2026-10-01T13:08:22.506427+09:00">更新 2026-10-01 13:08</time><button class="new-filter" type="button" aria-pressed="false">すべて表示中</button></div></div></header>
<div class="layout"><nav id="news-nav" aria-label="タイトル一覧"><div class="race-tabs desktop-race-tabs" aria-label="競技選択"><button class="race-tab" type="button" data-category="keirin" aria-pressed="true">競輪</button><button class="race-tab" type="button" data-category="autorace" aria-pressed="false">オート</button><button class="race-tab" type="button" data-category="boatrace" aria-pressed="false">ボート</button><button class="race-tab" type="button" data-category="local-keiba" aria-pressed="false">地方競馬</button><button class="race-tab" type="button" data-category="jra" aria-pressed="false">JRA</button></div><div class="mobile-race-tabs" aria-label="競技選択"><button class="race-tab" type="button" data-category="keirin" aria-pressed="true">競輪</button><button class="race-tab" type="button" data-category="autorace" aria-pressed="false">オート</button><button class="race-tab" type="button" data-category="boatrace" aria-pressed="false">ボート</button><button class="race-tab" type="button" data-category="local-keiba" aria-pressed="false">地方競馬</button><button class="race-tab" type="button" data-category="jra" aria-pressed="false">JRA</button></div><div class="mobile-title-scroll"><section class="title-group" data-category="keirin"><ol></ol></section><section class="title-group" data-category="autorace"><ol></ol></section><section class="title-group" data-category="boatrace"><ol></ol></section><section class="title-group" data-category="local-keiba"><ol></ol></section><section class="title-group" data-category="jra"><ol></ol></section></div></nav><div class="feed"></div></div></main>
<script>
let activeCategory = "keirin";
const tabs=[...document.querySelectorAll('.race-tab')],filterButton=document.querySelector('.new-filter');
function renderFilter(){const onlyNew=filterButton.getAttribute('aria-pressed')==='true';document.querySelectorAll('[data-category]').forEach(node=>{if(node.classList.contains('race-tab'))return;const categoryMatch=node.dataset.category===activeCategory;const newMatch=!onlyNew||node.dataset.new==='true'||node.classList.contains('title-group');node.hidden=!(categoryMatch&&newMatch)});document.querySelectorAll('.title-group').forEach(group=>{if(group.dataset.category!==activeCategory){group.hidden=true;return}group.hidden=!group.querySelector('li:not([hidden])')});document.querySelectorAll('.feed article').forEach(article=>article.classList.remove('visible-first'));const firstVisible=[...document.querySelectorAll('.feed article')].find(article=>!article.hidden);if(firstVisible)firstVisible.classList.add('visible-first')}
function selectCategory(slug){activeCategory=slug;tabs.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.category===slug)));renderFilter();window.scrollTo({top:0,behavior:'auto'})}
tabs.forEach(button=>button.addEventListener('click',()=>selectCategory(button.dataset.category)));filterButton.addEventListener('click',()=>{const onlyNew=filterButton.getAttribute('aria-pressed')!=='true';filterButton.setAttribute('aria-pressed',String(onlyNew));filterButton.textContent=onlyNew?'NEWのみ表示中':'すべて表示中';renderFilter()});
const header=document.querySelector('header'),menuButton=document.querySelector('.menu-toggle'),menu=document.getElementById('news-nav');const updateHeaderHeight=()=>document.documentElement.style.setProperty('--header-height',`${header.getBoundingClientRect().height}px`);updateHeaderHeight();new ResizeObserver(updateHeaderHeight).observe(header);function setMenu(open){document.body.classList.toggle('menu-open',open);menuButton.setAttribute('aria-expanded',String(open));menuButton.setAttribute('aria-label',open?'タイトル一覧を閉じる':'タイトル一覧を開く')}menuButton.addEventListener('click',()=>setMenu(menuButton.getAttribute('aria-expanded')!=='true'));menu.addEventListener('click',event=>{if(event.target.closest('a[href^="#"]'))setMenu(false)});document.addEventListener('keydown',event=>{if(event.key==='Escape')setMenu(false)});document.querySelector('header h1 a').addEventListener('click',()=>setMenu(false));
const pullIndicator=document.querySelector('.pull-refresh');let startY=null,startX=0,pullDistance=0;document.addEventListener('touchstart',event=>{startY=event.touches.length===1&&matchMedia('(max-width:700px)').matches&&window.scrollY<=0&&!document.body.classList.contains('menu-open')?event.touches[0].clientY:null;startX=event.touches[0]?.clientX||0;pullDistance=0},{passive:true});document.addEventListener('touchmove',event=>{if(startY===null||event.touches.length!==1)return;const dy=event.touches[0].clientY-startY;if(dy<=10||Math.abs(event.touches[0].clientX-startX)>dy||window.scrollY>0)return;event.preventDefault();pullDistance=Math.min(dy,120);pullIndicator.classList.add('active');pullIndicator.textContent=pullDistance>=90?'離して更新':'下に引いて更新'},{passive:false});function finishPull(){if(pullDistance>=90){pullIndicator.textContent='更新中…';window.location.reload()}else pullIndicator.classList.remove('active');startY=null;pullDistance=0}document.addEventListener('touchend',finishPull,{passive:true});document.addEventListener('touchcancel',()=>{pullIndicator.classList.remove('active');startY=null;pullDistance=0},{passive:true});renderFilter();
</script></body></html>
