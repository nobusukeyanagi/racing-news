name: Update racing news

on:
  schedule:
    # GitHub ActionsのcronはUTC。JST 0:00 / 6:00 / 12:00 / 18:00の目安。
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: racing-news-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      fresh: ${{ steps.build.outputs.fresh }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore previously fetched racing news
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: previous-site
          key: racing-news-snapshot-${{ github.run_id }}
          restore-keys: |
            racing-news-snapshot-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build page
        id: build
        shell: bash
        run: |
          rm -rf site
          if [[ "$GITHUB_EVENT_NAME" == "push" && -f previous-site/snapshot.json ]]; then
            cp -R previous-site site
            python scripts/build.py --from-snapshot site/snapshot.json --output site
            echo '保存済みデータからページを再生成しました'
          else
            python scripts/build.py --output site --previous-site previous-site
            echo 'fresh=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare next snapshot cache
        if: steps.build.outputs.fresh == 'true'
        run: |
          rm -rf previous-site
          cp -R site previous-site
      - name: Save racing news snapshot
        if: steps.build.outputs.fresh == 'true'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: previous-site
          key: racing-news-snapshot-${{ github.run_id }}
      - name: Package page
        run: tar --dereference --hard-dereference --exclude='./snapshot.json' -C site -cf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
