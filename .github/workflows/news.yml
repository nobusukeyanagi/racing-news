name: Update racing news

on:
  schedule:
    # GitHub ActionsのcronはUTC。JST 0:00 / 8:00 / 16:00の目安。
    - cron: '0 7,15,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: racing-news-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      fresh: ${{ steps.build.outputs.fresh }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore previously fetched racing news
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: previous-site
          key: racing-news-snapshot-${{ github.run_id }}
          restore-keys: |
            racing-news-snapshot-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build page
        id: build
        shell: bash
        run: |
          rm -rf site
          if [[ "$GITHUB_EVENT_NAME" == "push" && -f previous-site/snapshot.json ]]; then
            cp -R previous-site site
            python scripts/build.py --from-snapshot site/snapshot.json --output site
            echo '保存済みデータからページを再生成しました'
          else
            python scripts/build.py --output site --previous-site previous-site
            echo 'fresh=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare next snapshot cache
        if: steps.build.outputs.fresh == 'true'
        run: |
          rm -rf previous-site
          cp -R site previous-site
      - name: Save racing news snapshot
        if: steps.build.outputs.fresh == 'true'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: previous-site
          key: racing-news-snapshot-${{ github.run_id }}
      - name: Package page
        run: tar --dereference --hard-dereference --exclude='./snapshot.json' -C site -cf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Notify Discord
        if: needs.build.outputs.fresh == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not set; skip notification."
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          import urllib.request

          message = "🐴 公営競技ニュースを更新しました\nhttps://nobusukeyanagi.github.io/racing-news/"
          data = json.dumps({"content": message}, ensure_ascii=False).encode("utf-8")
          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "RacingNewsDiscordNotifier/1.0",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"Discord returned HTTP {response.status}")
          PY
